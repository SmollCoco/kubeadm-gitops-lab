apiVersion: v1
kind: ConfigMap
metadata:
  name: gitops-demo
  namespace: dev
data:
  index.html: |
    <h1>GitOps demo v1</h1>
  default.conf: |
    server {
        listen 80;
        location /healthz { return 200 'ok'; add_header Content-Type text/plain; }
        location / { root /usr/share/nginx/html; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-demo
  namespace: dev
  labels:
    app: gitops-demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: gitops-demo
  template:
    metadata:
      labels:
        app: gitops-demo
      annotations:
        # bump to roll pods after a ConfigMap change
        content-version: "1"
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - { name: site, mountPath: /usr/share/nginx/html/index.html, subPath: index.html }
            - { name: site, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf }
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: 80 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 80 }
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: site
          configMap:
            name: gitops-demo
---
apiVersion: v1
kind: Service
metadata:
  name: gitops-demo
  namespace: dev
spec:
  selector:
    app: gitops-demo
  ports:
    - port: 80
      targetPort: 80
